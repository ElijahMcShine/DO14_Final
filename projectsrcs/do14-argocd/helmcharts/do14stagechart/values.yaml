# Default values for onlineboutique.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

securityContext:
  enable: true

adService:
  create: true
  name: adservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-ad-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 200m
      memory: 180Mi
    limits:
      cpu: 300m
      memory: 300Mi

cartService:
  create: true
  name: cartservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-cart-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

checkoutService:
  create: true
  name: checkoutservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-checkout-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

currencyService:
  create: true
  name: currencyservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-currency-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

emailService:
  create: true
  name: emailservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-email-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

frontend:
  create: true
  name: frontend
  image: 
    name: docker.mcshine.ru/do14stage/do14-frontend
    tag: 26.01.05.17.35
  singleSharedSession: false
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

paymentService:
  create: true
  name: paymentservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-payment-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

productCatalogService:
  create: true
  name: productcatalogservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-product-catalog-service
    tag: 26.01.05.17.35
  # Specifies an extra latency to any request on productcatalogservice, by default no extra latency.
  extraLatency: ""
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

recommendationService:
  create: true
  name: recommendationservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-recommendation-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 100m
      memory: 220Mi
    limits:
      cpu: 200m
      memory: 450Mi

shippingService:
  create: true
  name: shippingservice
  image: 
    name: docker.mcshine.ru/do14stage/do14-shipping-service
    tag: 26.01.05.17.35
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

cartDatabase:
  # Specifies the type of the cartservice's database, could be either redis or spanner.
  type: redis
  connectionString: "redis-cart:6379"
  inClusterRedis:
    create: true
    name: redis-cart
    # Uses the public redis image from Docker Hub, otherwise will use the images.repository.
    publicRepository: true


ingress:
  enabled: true
  className: "contour"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    ingress.kubernetes.io/force-ssl-redirect: "true"
    kubernetes.io/tls-acme: "true"
  host: do14-stage.mcshine.ru
  tlsSecretName: do14-stage.mcshine.ru


imagePullSecrets: 
  - name: regcred
    value: <your reg creds>