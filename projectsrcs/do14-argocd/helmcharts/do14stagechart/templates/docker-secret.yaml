{{ $top := . }}
{{ range .Values.imagePullSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    version: {{ $top.Values.version }}
    {{- with $top.Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ .name }}
  namespace: {{ $top.Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: 
    {{ .value }}
{{ end }}
