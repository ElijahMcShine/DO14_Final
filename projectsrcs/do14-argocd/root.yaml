apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name     : root
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: do14
  destination:
    name     : in-cluster
    namespace: argocd
  source:
    path   : "applications"
    repoURL: "https://gitlab.mcshine.ru/do14-online-boutique/do14-argocd.git"
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune   : true
      selfHeal: true
