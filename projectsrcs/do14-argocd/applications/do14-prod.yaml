apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: do14-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io    
spec:
  destination:
    name: in-cluster
    namespace: do14-prod
  project: do14
  source:
    repoURL: "https://gitlab.mcshine.ru/do14-online-boutique/do14-argocd.git"
    path: "helmcharts/do14prodchart"
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true